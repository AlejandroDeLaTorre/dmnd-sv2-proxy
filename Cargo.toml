[package]
name = "dmnd-sv2-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
stratum-apps = { git = "https://github.com/stratum-mining/sv2-apps", tag = "v0.9.2", default-features = false, features = ["network", "std"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
secp256k1 = { version = "0.28.2", features = ["rand-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
